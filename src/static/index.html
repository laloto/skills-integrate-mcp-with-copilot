<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div class="account-menu">
        <button
          id="account-toggle"
          class="account-toggle"
          type="button"
          aria-label="Teacher account"
          aria-expanded="false"
          aria-controls="account-panel"
          title="Teacher account"
        >
          <span aria-hidden="true">&#128100;</span>
        </button>
        <div id="account-panel" class="account-panel hidden">
          <div id="public-account-actions">
            <p>Staff access</p>
            <button id="show-login-button" type="button">Teacher login</button>
          </div>
          <div id="teacher-account-actions" class="hidden">
            <p id="teacher-identity"></p>
            <button id="logout-button" type="button">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h2 id="login-title">Teacher login</h2>
        <p>Sign in to manage activity registrations.</p>
        <div class="form-group">
          <label for="teacher-username">Username</label>
          <input id="teacher-username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password</label>
          <input id="teacher-password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div id="login-message" class="hidden" role="alert"></div>
        <div class="dialog-actions">
          <button id="cancel-login-button" class="button-secondary" type="button">Cancel</button>
          <button type="submit">Sign in</button>
        </div>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
